name: NFTArts
options:
  bundleIdPrefix: com.gorenkov
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "27LYLK4WV8"

targets:
  NFTArts:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: NFTArts
        excludes:
          - "**/.DS_Store"
          - "Resources/ML/DepthAnythingV2SmallF16INT8.mlpackage"
      # .mlpackage явно в Compile Sources — иначе Xcode не запускает coremlc и в bundle
      # не появляется скомпилированный .mlmodelc → DepthEstimator не находит модель.
      - path: NFTArts/Resources/ML/DepthAnythingV2SmallF16INT8.mlpackage
        buildPhase: sources
    settings:
      base:
        INFOPLIST_FILE: NFTArts/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.gorenkov.NFTArts
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
        SUPPORTED_PLATFORMS: "iphonesimulator iphoneos"
        SUPPORTS_MACCATALYST: false
    resources:
      - path: NFTArts/Resources/Assets.xcassets


  NFTArtsAdmin:
    type: application
    platform: macOS
    deploymentTarget:
      macOS: "13.0"
    sources:
      - path: NFTArtsAdmin
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: NFTArtsAdmin/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.gorenkov.NFTArtsAdmin
        MACOSX_DEPLOYMENT_TARGET: "13.0"
    resources:
      - path: NFTArtsAdmin/Resources/Assets.xcassets
      - path: NFTArtsAdmin/Resources/AppIcon.icns
